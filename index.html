<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<meta name="description" content="Your fictional football universe, tracked your way.">
<link rel="manifest" href="manifest.json">
<title>Fictional Football</title>
<style>
:root{--bg:#07111f;--panel:#101e30;--panel2:#15263b;--line:#263b53;--text:#f2f6fb;--muted:#9aadc2;--green:#53e08a;--blue:#55b8ff;--gold:#f7ce68;--red:#ff7272}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#081322,#07111f 55%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:980px;margin:auto;min-height:100vh;padding-bottom:86px}.top{padding:22px 18px 12px;position:sticky;top:0;background:#07111fee;backdrop-filter:blur(14px);z-index:5;border-bottom:1px solid #182a40}.brand{display:flex;align-items:center;gap:10px;font-weight:850;font-size:20px}.ball{width:38px;height:38px;border-radius:13px;background:#17334b;display:grid;place-items:center;font-size:22px}.sub{color:var(--muted);font-size:12px;margin:3px 0 0 48px}.content{padding:16px}.nav{position:fixed;bottom:0;left:0;right:0;background:#091625f5;backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:10;padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}.nav button{background:transparent;color:var(--muted);border:0;padding:8px 10px;flex:1;max-width:150px;font-size:11px;border-radius:12px}.nav button.active{color:var(--green);background:#163127}.nav span{display:block;font-size:20px;margin-bottom:3px}.hero{background:linear-gradient(135deg,#153a3b,#132741 62%,#182443);border:1px solid #28515b;border-radius:20px;padding:19px;margin-bottom:16px}.hero h1{margin:0 0 6px;font-size:24px}.hero p{margin:0;color:#c0d1df;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}.stat .num{font-size:25px;font-weight:850;letter-spacing:-.5px}.stat .label{font-size:12px;color:var(--muted)}.section{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 0 10px}.section h2{font-size:17px;margin:0}.btn{border:0;background:var(--green);color:#052012;font-weight:800;border-radius:11px;padding:10px 13px}.btn.secondary{background:#1d334b;color:var(--text);border:1px solid #304a65}.btn.danger{background:#48252d;color:#ffd8dc}.btn.small{padding:7px 10px;font-size:12px}.search{width:100%;background:#0c1a2a;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px;margin-bottom:12px}.list{display:grid;gap:9px}.player{display:flex;align-items:center;gap:12px;padding:13px;background:var(--panel);border:1px solid var(--line);border-radius:15px;cursor:pointer}.avatar{width:48px;height:48px;flex:0 0 48px;border-radius:14px;background:linear-gradient(145deg,#234e5a,#243253);display:grid;place-items:center;font-size:23px;font-weight:850;color:var(--green)}.player-main{min-width:0;flex:1}.player-name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.muted{color:var(--muted);font-size:12px}.right{text-align:right}.green{color:var(--green)}.gold{color:var(--gold)}.tabs{display:flex;gap:7px;overflow:auto;margin:0 0 14px}.tabs button{white-space:nowrap;border:1px solid var(--line);background:#0d1a2b;color:var(--muted);padding:9px 12px;border-radius:10px}.tabs button.active{background:#173a31;border-color:#2b7450;color:var(--green)}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:13px}table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}th,td{text-align:right;padding:11px 9px;border-bottom:1px solid #203248}th{color:var(--muted);font-weight:650;background:#0d1a2b}th:first-child,td:first-child{text-align:left}tr:last-child td{border-bottom:0}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted)}.field input,.field select,.field textarea{width:100%;min-width:0;background:#0b1929;border:1px solid #2b4058;color:var(--text);padding:11px;border-radius:10px}.field textarea{min-height:72px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.pill{display:inline-block;padding:4px 8px;border-radius:7px;background:#193248;color:#bfe5ff;font-size:11px}.empty{text-align:center;padding:32px 15px;color:var(--muted);border:1px dashed #2a4058;border-radius:15px}.profile-head{display:flex;gap:14px;align-items:center;margin-bottom:16px}.profile-head .avatar{width:72px;height:72px;flex-basis:72px;font-size:30px}.profile-head h1{margin:0 0 4px;font-size:23px}.note{font-size:12px;color:var(--muted);line-height:1.5}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hidden{display:none!important}.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#d6ffe4;color:#082016;padding:10px 16px;border-radius:12px;z-index:20;font-weight:750;box-shadow:0 5px 30px #0006}.footer-note{text-align:center;color:#72879d;font-size:11px;padding:22px 10px}
@media(min-width:650px){.content{padding:22px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.player-list{grid-template-columns:repeat(2,minmax(0,1fr))}.form{grid-template-columns:repeat(3,minmax(0,1fr))}.field.full{grid-column:1/-1}.nav{left:50%;transform:translateX(-50%);width:min(100%,980px);border-left:1px solid var(--line);border-right:1px solid var(--line);border-radius:18px 18px 0 0}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="ball">⚽</div><div>Fictional Football<div class="muted" style="font-weight:500">Your universe. Your stats.</div></div></div></header>
<main id="view" class="content"></main>
<nav class="nav">
<button data-page="home" class="active"><span>⌂</span>Home</button>
<button data-page="players"><span>♟</span>Players</button>
<button data-page="competitions"><span>🏆</span>Competitions</button>
<button data-page="standings"><span>▤</span>Standings</button>
<button data-page="more"><span>•••</span>More</button>
</nav>
</div>
<div id="toast" class="toast hidden"></div>
<script>
const KEY='fictional-football-v1';
const seedPlayers=[
{id:'sergio',name:'Sergio Alcaraz',nationality:'Spain',position:'LW / ST',club:'Arsenal',number:14,age:20,marketValue:150,overall:92,notes:'Confident, funny, Ronaldo-like mentality.',seasons:[
{season:'2026/27',team:'Valencia',apps:34,g:21,a:8,comps:[{name:'La Liga',apps:30,g:19,a:8},{name:'Copa del Rey',apps:4,g:2,a:0}],rating:7.8},
{season:'2027/28',team:'Arsenal',apps:52,g:40,a:12,comps:[{name:'Premier League',apps:38,g:25,a:7},{name:'Champions League',apps:13,g:13,a:4},{name:'Other',apps:1,g:2,a:1}],rating:8.4},
{season:'2028/29',team:'Arsenal',apps:56,g:53,a:23,comps:[{name:'Premier League',apps:37,g:37,a:20},{name:'Champions League',apps:13,g:13,a:3},{name:'FA Cup',apps:4,g:2,a:0},{name:'Carabao Cup',apps:2,g:1,a:0}],rating:9.1}]},
{id:'arda',name:'Arda Kurtulus',nationality:'Turkey',position:'RW / LB / AM',club:'Arsenal',number:9,age:20,marketValue:200,overall:94,notes:'Quiet and polite; former Fenerbahçe player.',seasons:[
{season:'2026/27',team:'Fenerbahçe',apps:49,g:10,a:9,comps:[],rating:7.4},
{season:'2027/28',team:'Fenerbahçe',apps:42,g:30,a:8,comps:[],rating:8.2},
{season:'2028/29',team:'Arsenal',apps:52,g:39,a:30,comps:[{name:'Premier League',apps:38,g:30,a:20},{name:'Champions League',apps:13,g:5,a:9}],rating:8.9}]},
{id:'theo',name:'Theo Fontaine',nationality:'France',position:'LW / ST',club:'Inter',number:7,age:20,marketValue:140,overall:91,notes:'Elite dribbler; childhood best friend of Amine.',seasons:[
{season:'2026/27',team:'PSV',apps:39,g:16,a:8,comps:[{name:'Eredivisie',apps:30,g:14,a:5},{name:'Champions League',apps:8,g:2,a:3}],rating:7.6},
{season:'2027/28',team:'PSV',apps:46,g:20,a:12,comps:[{name:'Eredivisie',apps:32,g:14,a:9},{name:'Dutch Cup',apps:5,g:3,a:1},{name:'Champions League',apps:9,g:3,a:1}],rating:8.0},
{season:'2028/29',team:'Inter',apps:0,g:0,a:0,comps:[],rating:0}]},
{id:'kilic',name:'Wilhelm Kılıç',nationality:'Turkey',position:'RW',club:'Manchester City',number:11,age:20,marketValue:180,overall:93,notes:'Turkish winger; unhappy at City in recent seasons.',seasons:[
{season:'2026/27',team:'Fenerbahçe',apps:44,g:28,a:19,comps:[],rating:8.1},
{season:'2027/28',team:'Manchester City',apps:49,g:31,a:18,comps:[],rating:8.3},
{season:'2028/29',team:'Manchester City',apps:52,g:39,a:21,comps:[],rating:8.5}]},
{id:'felix',name:'Felix Voss',nationality:'Germany',position:'ST',club:'Real Madrid',number:9,age:21,marketValue:120,overall:89,notes:'German striker.',seasons:[]},
{id:'luis',name:'Luis Herrera',nationality:'Mexico',position:'RW / CAM / CF',club:'Bayern Munich',number:42,age:24,marketValue:95,overall:88,notes:'Career totals previously established: 263 apps, 193 goals, 96 assists for Bayern.',seasons:[]},
{id:'leon',name:'Leon Ritter',nationality:'Germany',position:'ST',club:'Real Madrid',number:10,age:27,marketValue:160,overall:96,notes:'Legendary La Fábrica striker; 10 UCL titles, 678 goals in 666 appearances (career canon).',seasons:[]},
{id:'vega',name:'Vega',nationality:'Unknown',position:'LW',club:'Arsenal',number:17,age:20,marketValue:65,overall:83,notes:'',seasons:[]},
{id:'wilhelm',name:'Wilhelm Fischer',nationality:'Germany',position:'RW',club:'Unknown',number:0,age:20,marketValue:50,overall:80,notes:'',seasons:[]},
{id:'mateo',name:'Mateo Kempes',nationality:'Unknown',position:'LW / ST',club:'Unknown',number:0,age:20,marketValue:50,overall:80,notes:'',seasons:[]},
{id:'arsene',name:'Arsene Favre',nationality:'Unknown',position:'RW',club:'Unknown',number:0,age:20,marketValue:50,overall:80,notes:'',seasons:[]}
];
const seedAwards=[
{playerId:'sergio',season:'2027/28',name:'Champions League Winner'},
{playerId:'sergio',season:'2027/28',name:'Champions League Golden Boot'},
{playerId:'sergio',season:'2028/29',name:'Premier League Player of the Year'},
{playerId:'arda',season:'2027/28',name:'Euro Top Scorer'},
{playerId:'arda',season:'2027/28',name:'Euro Best Young Player'},
{playerId:'arda',season:'2028/29',name:'Premier League Young Player of the Year'},
{playerId:'theo',season:'2026/27',name:'Eredivisie Young Player of the Year'},
{playerId:'theo',season:'2027/28',name:'Eredivisie Young Player of the Year'}
];
function initial(){return {players:seedPlayers,awards:seedAwards,transfers:[{id:1,playerId:'sergio',season:'2027/28',from:'Valencia',to:'Arsenal',fee:150},{id:2,playerId:'arda',season:'2028/29',from:'Fenerbahçe',to:'Arsenal',fee:200},{id:3,playerId:'theo',season:'2028/29',from:'PSV',to:'Inter',fee:140},{id:4,playerId:'kilic',season:'2027/28',from:'Fenerbahçe',to:'Manchester City',fee:180}],matches:[],competitions:['Premier League','Champions League','FA Cup','Carabao Cup','La Liga','Copa del Rey','Eredivisie','Dutch Cup','Euro','World Cup'],clubs:['Arsenal','Real Madrid','Inter','Manchester City','Valencia','PSV','Fenerbahçe','Bayern Munich'],selected:null};}
let db;try{db=JSON.parse(localStorage.getItem(KEY))||initial()}catch(e){db=initial()}
let page='home', profileTab='overview', editId=null;
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(v){return Number(v)||0}
function totals(p){return (p.seasons||[]).reduce((t,s)=>({apps:t.apps+num(s.apps),g:t.g+num(s.g),a:t.a+num(s.a)}),{apps:0,g:0,a:0})}
function byId(id){return db.players.find(p=>p.id===id)}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),1800)}
function go(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
function avatar(p){return esc((p.name||'?').split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase())}
function playerCard(p){let t=totals(p);return `<div class="player" onclick="openPlayer('${p.id}')"><div class="avatar">${avatar(p)}</div><div class="player-main"><div class="player-name">${esc(p.name)}</div><div class="muted">${esc(p.position)} · ${esc(p.club||'Free agent')}</div><div class="muted">${esc(p.nationality||'Nationality not set')} · ${p.overall||'—'} OVR</div></div><div class="right"><div class="green" style="font-weight:850">${t.g} ⚽</div><div class="muted">${t.a} assists</div></div></div>`}
function stat(label,value){return `<div class="stat"><div class="num">${esc(value)}</div><div class="label">${label}</div></div>`}
function render(){const v=document.getElementById('view');if(page==='home')v.innerHTML=home();else if(page==='players')v.innerHTML=playersPage();else if(page==='competitions')v.innerHTML=competitionsPage();else if(page==='standings')v.innerHTML=standingsPage();else if(page==='more')v.innerHTML=morePage();else if(page==='profile')v.innerHTML=profilePage();else if(page==='editor')v.innerHTML=editorPage();else if(page==='match')v.innerHTML=matchPage();else if(page==='compare')v.innerHTML=comparePage();else if(page==='transfers')v.innerHTML=transfersPage();else if(page==='awards')v.innerHTML=awardsPage();else if(page==='backup')v.innerHTML=backupPage();wire()}
function home(){let top=[...db.players].sort((a,b)=>totals(b).g-totals(a).g).slice(0,4);let leaders=[...db.players].sort((a,b)=>totals(b).g-totals(a).g).slice(0,5);return `<div class="hero"><h1>Your football universe ⚽</h1><p>Track every fictional star, season, transfer and trophy. All data stays on this device unless you export it.</p><div class="actions"><button class="btn" onclick="newPlayer()">＋ Create player</button><button class="btn secondary" onclick="go('match')">＋ Add match result</button></div></div><div class="grid">${stat('Players',db.players.length)}${stat('Competitions',db.competitions.length)}${stat('Recorded matches',db.matches.length)}${stat('Transfers',db.transfers.length)}</div><div class="section"><h2>⭐ Featured players</h2><button class="btn secondary small" onclick="go('players')">All players</button></div><div class="list player-list">${top.map(playerCard).join('')}</div><div class="section"><h2>🏅 Goal leaders</h2></div><div class="card">${leaders.map((p,i)=>`<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #203248"><b class="muted">${i+1}</b><div style="flex:1;font-weight:700">${esc(p.name)}</div><b class="green">${totals(p).g}</b></div>`).join('')}</div><div class="footer-note">Fictional Football · Fan-made stats tracker</div>`}
function playersPage(){return `<div class="section" style="margin-top:2px"><h2>Players (${db.players.length})</h2><button class="btn" onclick="newPlayer()">＋ Add</button></div><input class="search" id="playerSearch" placeholder="Search player, club, nation or position…" oninput="filterPlayers()"><div id="playerList" class="list player-list">${db.players.map(playerCard).join('')}</div>`}
function filterPlayers(){let q=document.getElementById('playerSearch').value.toLowerCase();document.getElementById('playerList').innerHTML=db.players.filter(p=>[p.name,p.club,p.nationality,p.position].join(' ').toLowerCase().includes(q)).map(playerCard).join('')||'<div class="empty">No players found.</div>'}
function openPlayer(id){db.selected=id;page='profile';profileTab='overview';render()}
function profilePage(){let p=byId(db.selected);if(!p){page='players';return playersPage()}let t=totals(p);let content='';if(profileTab==='overview')content=`<div class="grid">${stat('Appearances',t.apps)}${stat('Goals',t.g)}${stat('Assists',t.a)}${stat('Goal contributions',t.g+t.a)}</div><div class="section"><h2>Player details</h2><button class="btn secondary small" onclick="editPlayer('${p.id}')">Edit profile</button></div><div class="card"><div class="two"><div><div class="muted">Nationality</div><b>${esc(p.nationality||'—')}</b></div><div><div class="muted">Position</div><b>${esc(p.position||'—')}</b></div><div><div class="muted">Club</div><b>${esc(p.club||'Free agent')}</b></div><div><div class="muted">Age / Number</div><b>${esc(p.age||'—')} / ${esc(p.number||'—')}</b></div><div><div class="muted">Market value</div><b class="gold">€${num(p.marketValue)}m</b></div><div><div class="muted">Overall rating</div><b class="green">${esc(p.overall||'—')} / 100</b></div></div>${p.notes?`<p class="note">${esc(p.notes)}</p>`:''}</div><div class="section"><h2>Season history</h2><button class="btn small" onclick="addSeason('${p.id}')">＋ Season</button></div>${seasonTable(p)}`;
if(profileTab==='stats')content=`<div class="section"><h2>Season statistics</h2><button class="btn small" onclick="addSeason('${p.id}')">＋ Add season</button></div>${seasonTable(p)}<p class="note">Use the edit-season form to enter competition-by-competition figures. Career totals update automatically.</p>`;
if(profileTab==='career')content=`<div class="section"><h2>Career transfers</h2><button class="btn small" onclick="newTransfer('${p.id}')">＋ Transfer</button></div>${transferList(db.transfers.filter(x=>x.playerId===p.id))}<div class="section"><h2>International stats</h2><button class="btn small" onclick="editInternational('${p.id}')">Edit stats</button></div><div class="grid">${stat('Caps',num(p.caps))}${stat('International goals',num(p.intGoals))}${stat('International assists',num(p.intAssists))}${stat('Trophies',db.awards.filter(a=>a.playerId===p.id&&a.name.toLowerCase().includes('winner')).length)}</div>`;
if(profileTab==='trophies')content=`<div class="section"><h2>Trophies & awards</h2><button class="btn small" onclick="newAward('${p.id}')">＋ Award</button></div>${awardList(db.awards.filter(a=>a.playerId===p.id))}`;
return `<button class="btn secondary small" onclick="go('players')">← Players</button><div class="profile-head" style="margin-top:16px"><div class="avatar">${avatar(p)}</div><div style="flex:1"><h1>${esc(p.name)}</h1><div class="muted">${esc(p.nationality)} · ${esc(p.position)}</div><div class="muted">${esc(p.club)} ${p.number?'· #'+p.number:''}</div></div><button class="btn secondary small" onclick="editPlayer('${p.id}')">✎</button></div><div class="tabs">${['overview','stats','career','trophies'].map(x=>`<button class="${profileTab===x?'active':''}" onclick="profileTab='${x}';render()">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div>${content}<div class="actions"><button class="btn secondary" onclick="comparePlayer('${p.id}')">Compare player</button><button class="btn danger small" onclick="deletePlayer('${p.id}')">Delete player</button></div>`}
function seasonTable(p){if(!p.seasons?.length)return '<div class="empty">No season stats yet. Tap “＋ Season” to add a season.</div>';return `<div class="table-wrap"><table><thead><tr><th>Season / Club</th><th>Apps</th><th>G</th><th>A</th><th>Rating</th><th></th></tr></thead><tbody>${p.seasons.map((s,i)=>`<tr><td><b>${esc(s.season)}</b><br><span class="muted">${esc(s.team||'')}</span></td><td>${num(s.apps)}</td><td class="green">${num(s.g)}</td><td>${num(s.a)}</td><td>${num(s.rating).toFixed(1)}</td><td><button class="btn secondary small" onclick="editSeason('${p.id}',${i})">Edit</button></td></tr>`).join('')}</tbody></table></div><div class="section"><h2>Competition breakdown</h2></div>${p.seasons.flatMap(s=>(s.comps||[]).map(c=>({...c,season:s.season}))).length?`<div class="table-wrap"><table><thead><tr><th>Competition</th><th>Season</th><th>Apps</th><th>G</th><th>A</th></tr></thead><tbody>${p.seasons.flatMap(s=>(s.comps||[]).map(c=>({...c,season:s.season}))).map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.season)}</td><td>${num(c.apps)}</td><td>${num(c.g)}</td><td>${num(c.a)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="note">No competition breakdowns entered yet.</p>'}`}
function competitionsPage(){return `<div class="section" style="margin-top:2px"><h2>Competitions</h2><button class="btn" onclick="newCompetition()">＋ Add</button></div><div class="list">${db.competitions.map(c=>`<div class="player"><div class="avatar">🏆</div><div class="player-main"><div class="player-name">${esc(c)}</div><div class="muted">${db.matches.filter(m=>m.competition===c).length} recorded matches</div></div><button class="btn secondary small" onclick="showCompetition('${esc(c).replace(/'/g,"\\'")}')">View</button></div>`).join('')}</div><div class="section"><h2>Record a match</h2></div><button class="btn" onclick="go('match')">＋ Add match result</button>`}
function showCompetition(c){let ms=db.matches.filter(m=>m.competition===c);document.getElementById('view').innerHTML=`<button class="btn secondary small" onclick="go('competitions')">← Competitions</button><div class="section"><h2>${esc(c)}</h2></div>${ms.length?ms.map(matchCard).join(''):'<div class="empty">No matches recorded for this competition yet.</div>'}`}
function standingsPage(){let comps=[...new Set(db.matches.map(m=>m.competition))];let c=comps[0]||db.competitions[0]||'';return `<div class="section" style="margin-top:2px"><h2>League standings</h2><button class="btn small" onclick="go('match')">＋ Result</button></div><div class="field"><label>Competition / league</label><select id="standComp" onchange="drawStandings()">${db.competitions.map(x=>`<option ${x===c?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div id="standingsTable" style="margin-top:12px">${standTable(c)}</div><p class="note">Standings calculate from the match results you enter. Cup competitions can be tracked as fixtures too, but the table format is league-style.</p>`}
function standTable(c){let teams={};db.matches.filter(m=>m.competition===c).forEach(m=>{for(let n of [m.home,m.away])if(n&&!teams[n])teams[n]={team:n,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0};let h=teams[m.home],a=teams[m.away];if(!h||!a)return;h.p++;a.p++;h.gf+=num(m.hg);h.ga+=num(m.ag);a.gf+=num(m.ag);a.ga+=num(m.hg);if(num(m.hg)>num(m.ag)){h.w++;h.pts+=3;a.l++}else if(num(m.hg)<num(m.ag)){a.w++;a.pts+=3;h.l++}else{h.d++;a.d++;h.pts++;a.pts++}});let rows=Object.values(teams).sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf);return rows.length?`<div class="table-wrap"><table><thead><tr><th>Club</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td><b>${i+1}. ${esc(r.team)}</b></td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.gf}</td><td>${r.ga}</td><td>${r.gf-r.ga}</td><td class="green"><b>${r.pts}</b></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No results yet. Add match results to generate a table.</div>'}
function drawStandings(){document.getElementById('standingsTable').innerHTML=standTable(document.getElementById('standComp').value)}
function morePage(){return `<div class="section" style="margin-top:2px"><h2>More tools</h2></div><div class="list"><div class="player" onclick="go('transfers')"><div class="avatar">↗</div><div class="player-main"><div class="player-name">Transfer centre</div><div class="muted">Transfer history, fees and clubs</div></div>›</div><div class="player" onclick="go('awards')"><div class="avatar">🏅</div><div class="player-main"><div class="player-name">Awards & trophies</div><div class="muted">Every player's honours</div></div>›</div><div class="player" onclick="go('compare')"><div class="avatar">⚖</div><div class="player-main"><div class="player-name">Compare players</div><div class="muted">Goals, assists, apps and ratings</div></div>›</div><div class="player" onclick="go('backup')"><div class="avatar">💾</div><div class="player-main"><div class="player-name">Backup & restore</div><div class="muted">Export or import your universe</div></div>›</div><div class="player" onclick="resetDemo()"><div class="avatar">↺</div><div class="player-main"><div class="player-name">Restore original demo</div><div class="muted">Replaces current data with initial data</div></div>›</div></div><div class="section"><h2>About</h2></div><div class="card"><b>Fictional Football</b><p class="note">A personal, offline-first stats tracker inspired by football score apps. It is not affiliated with FotMob. Data is saved locally in this browser. Export backups regularly, and avoid clearing browser storage.</p></div>`}
function transferList(list){return list.length?`<div class="list">${list.map(t=>`<div class="player"><div class="avatar">↗</div><div class="player-main"><div class="player-name">${esc(byId(t.playerId)?.name||'Unknown player')}</div><div class="muted">${esc(t.season)} · ${esc(t.from)} → ${esc(t.to)}</div></div><div class="right gold">€${num(t.fee)}m</div></div>`).join('')}</div>`:'<div class="empty">No transfers recorded.</div>'}
function transfersPage(){return `<div class="section" style="margin-top:2px"><h2>Transfer centre</h2><button class="btn" onclick="newTransfer()">＋ Transfer</button></div>${transferList(db.transfers)}<div class="section"><h2>Market values</h2></div><div class="table-wrap"><table><thead><tr><th>Player</th><th>Club</th><th>Value</th></tr></thead><tbody>${[...db.players].sort((a,b)=>num(b.marketValue)-num(a.marketValue)).map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.club)}</td><td class="gold">€${num(p.marketValue)}m</td></tr>`).join('')}</tbody></table></div>`}
function awardList(list){return list.length?`<div class="list">${list.map(a=>`<div class="player"><div class="avatar">🏆</div><div class="player-main"><div class="player-name">${esc(a.name)}</div><div class="muted">${esc(a.season||'Season unknown')}</div></div></div>`).join('')}</div>`:'<div class="empty">No awards recorded.</div>'}
function awardsPage(){return `<div class="section" style="margin-top:2px"><h2>Awards & trophies</h2><button class="btn" onclick="newAward()">＋ Award</button></div>${awardList(db.awards)}`}
function comparePage(){return `<div class="section" style="margin-top:2px"><h2>Compare players</h2></div><div class="form"><div class="field"><label>Player 1</label><select id="cmp1">${db.players.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Player 2</label><select id="cmp2">${db.players.map((p,i)=>`<option value="${p.id}" ${i===1?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div></div><div class="actions"><button class="btn" onclick="drawCompare()">Compare</button></div><div id="cmpResults" style="margin-top:15px"></div>`}
function comparePlayer(id){go('compare');setTimeout(()=>{document.getElementById('cmp1').value=id;drawCompare()},0)}
function drawCompare(){let p1=byId(document.getElementById('cmp1').value),p2=byId(document.getElementById('cmp2').value);if(!p1||!p2)return;let a=totals(p1),b=totals(p2);let rows=[['Appearances',a.apps,b.apps],['Goals',a.g,b.g],['Assists',a.a,b.a],['Goal contributions',a.g+a.a,b.g+b.a],['Overall rating',num(p1.overall),num(p2.overall)],['Market value (€m)',num(p1.marketValue),num(p2.marketValue)]];document.getElementById('cmpResults').innerHTML=`<div class="two"><div class="card"><div class="avatar">${avatar(p1)}</div><b>${esc(p1.name)}</b></div><div class="card"><div class="avatar">${avatar(p2)}</div><b>${esc(p2.name)}</b></div></div><div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>Stat</th><th>${esc(p1.name)}</th><th>${esc(p2.name)}</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td class="${r[1]>r[2]?'green':''}">${r[1]}</td><td class="${r[2]>r[1]?'green':''}">${r[2]}</td></tr>`).join('')}</tbody></table></div>`}
function matchCard(m){return `<div class="player"><div class="player-main"><div class="muted">${esc(m.competition)} · ${esc(m.date||'Date unknown')}</div><div class="player-name">${esc(m.home)} <span class="green">${num(m.hg)} – ${num(m.ag)}</span> ${esc(m.away)}</div></div><button class="btn danger small" onclick="deleteMatch(${m.id})">×</button></div>`}
function matchPage(){return `<div class="section" style="margin-top:2px"><h2>Record match result</h2></div><div class="card"><form onsubmit="saveMatch(event)"><div class="form"><div class="field full"><label>Competition</label><select name="competition">${db.competitions.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div class="field full"><label>Date (optional)</label><input name="date" type="date"></div><div class="field"><label>Home team</label><input name="home" required placeholder="Arsenal"></div><div class="field"><label>Away team</label><input name="away" required placeholder="Real Madrid"></div><div class="field"><label>Home goals</label><input name="hg" type="number" min="0" required value="0"></div><div class="field"><label>Away goals</label><input name="ag" type="number" min="0" required value="0"></div></div><div class="actions"><button class="btn" type="submit">Save result</button><button class="btn secondary" type="button" onclick="go('standings')">View standings</button></div></form></div><div class="section"><h2>Recent results</h2></div><div class="list">${db.matches.slice().reverse().slice(0,10).map(matchCard).join('')||'<div class="empty">No matches recorded yet.</div>'}</div>`}
function editorPage(){let p=editId?byId(editId):null;return `<div class="section" style="margin-top:2px"><h2>${p?'Edit player':'Create player'}</h2><button class="btn secondary small" onclick="${p?`openPlayer('${p.id}')`:`go('players')`}">Cancel</button></div><div class="card"><form onsubmit="savePlayer(event)"><div class="form"><div class="field full"><label>Player name *</label><input name="name" required value="${esc(p?.name||'')}" placeholder="e.g. Sergio Alcaraz"></div><div class="field"><label>Nationality</label><input name="nationality" value="${esc(p?.nationality||'')}" placeholder="Spain"></div><div class="field"><label>Position</label><input name="position" value="${esc(p?.position||'')}" placeholder="LW / ST"></div><div class="field"><label>Current club</label><input name="club" value="${esc(p?.club||'')}" placeholder="Arsenal"></div><div class="field"><label>Squad number</label><input name="number" type="number" value="${num(p?.number)}"></div><div class="field"><label>Age</label><input name="age" type="number" min="0" value="${num(p?.age)||''}"></div><div class="field"><label>Overall (0–100)</label><input name="overall" type="number" min="0" max="100" value="${num(p?.overall)||''}"></div><div class="field"><label>Market value (€m)</label><input name="marketValue" type="number" min="0" value="${num(p?.marketValue)}"></div><div class="field"><label>National team caps</label><input name="caps" type="number" min="0" value="${num(p?.caps)}"></div><div class="field"><label>International goals</label><input name="intGoals" type="number" min="0" value="${num(p?.intGoals)}"></div><div class="field"><label>International assists</label><input name="intAssists" type="number" min="0" value="${num(p?.intAssists)}"></div><div class="field full"><label>Notes / backstory</label><textarea name="notes">${esc(p?.notes||'')}</textarea></div></div><div class="actions"><button class="btn" type="submit">Save player</button></div></form></div>`}
function newPlayer(){editId=null;page='editor';render()}
function editPlayer(id){editId=id;page='editor';render()}
function savePlayer(e){e.preventDefault();let f=new FormData(e.target),o=Object.fromEntries(f.entries());let p={id:editId||('p'+Date.now()),name:o.name.trim(),nationality:o.nationality,position:o.position,club:o.club,number:num(o.number),age:num(o.age),overall:num(o.overall),marketValue:num(o.marketValue),caps:num(o.caps),intGoals:num(o.intGoals),intAssists:num(o.intAssists),notes:o.notes,seasons:editId?(byId(editId).seasons||[]):[]};if(editId){let i=db.players.findIndex(x=>x.id===editId);db.players[i]=p}else db.players.push(p);save();db.selected=p.id;page='profile';profileTab='overview';render();toast('Player saved')}
function deletePlayer(id){if(!confirm('Delete this player and their associated awards/transfers?'))return;db.players=db.players.filter(p=>p.id!==id);db.awards=db.awards.filter(a=>a.playerId!==id);db.transfers=db.transfers.filter(t=>t.playerId!==id);save();go('players');toast('Player deleted')}
function seasonForm(id,index){let p=byId(id),s=index>=0?p.seasons[index]:{season:'2029/30',team:p.club,apps:0,g:0,a:0,rating:0,comps:[]};let comps=(s.comps||[]).map(c=>`${c.name}|${c.apps}|${c.g}|${c.a}`).join('\\n');let val=(key)=>esc(s[key]??'');document.getElementById('view').innerHTML=`<button class="btn secondary small" onclick="openPlayer('${id}')">← Player</button><div class="section"><h2>${index>=0?'Edit':'Add'} season stats · ${esc(p.name)}</h2></div><div class="card"><form onsubmit="saveSeason(event,'${id}',${index})"><div class="form"><div class="field"><label>Season</label><input name="season" required value="${val('season')}"></div><div class="field"><label>Club that season</label><input name="team" value="${val('team')}"></div><div class="field"><label>Appearances</label><input name="apps" type="number" min="0" value="${num(s.apps)}"></div><div class="field"><label>Goals</label><input name="g" type="number" min="0" value="${num(s.g)}"></div><div class="field"><label>Assists</label><input name="a" type="number" min="0" value="${num(s.a)}"></div><div class="field"><label>Average rating</label><input name="rating" type="number" min="0" max="10" step=".1" value="${num(s.rating)}"></div><div class="field full"><label>Competition breakdown — one per line: Competition|Apps|Goals|Assists</label><textarea name="comps" placeholder="Premier League|38|25|10&#10;Champions League|13|8|4">${esc(comps.replace(/\\n/g,'\n'))}</textarea></div></div><p class="note">Use the exact competition name you want to see in the breakdown.</p><div class="actions"><button class="btn" type="submit">Save season</button>${index>=0?`<button class="btn danger" type="button" onclick="removeSeason('${id}',${index})">Delete season</button>`:''}</div></form></div>`}
function addSeason(id){seasonForm(id,-1)}function editSeason(id,i){seasonForm(id,i)}
function saveSeason(e,id,index){e.preventDefault();let f=new FormData(e.target),o=Object.fromEntries(f.entries()),comps=o.comps.split('\n').map(line=>line.trim()).filter(Boolean).map(line=>{let [name,apps,g,a]=line.split('|');return{name:name.trim(),apps:num(apps),g:num(g),a:num(a)}});let s={season:o.season,team:o.team,apps:num(o.apps),g:num(o.g),a:num(o.a),rating:num(o.rating),comps};let p=byId(id);if(index<0)p.seasons.push(s);else p.seasons[index]=s;save();page='profile';db.selected=id;render();toast('Season stats saved')}
function removeSeason(id,i){if(!confirm('Delete this season?'))return;byId(id).seasons.splice(i,1);save();page='profile';db.selected=id;render()}
function newTransfer(playerId=''){let opts=db.players.map(p=>`<option value="${p.id}" ${p.id===playerId?'selected':''}>${esc(p.name)}</option>`).join('');document.getElementById('view').innerHTML=`<button class="btn secondary small" onclick="go('transfers')">← Transfers</button><div class="section"><h2>Record transfer</h2></div><div class="card"><form onsubmit="saveTransfer(event)"><div class="form"><div class="field full"><label>Player</label><select name="playerId">${opts}</select></div><div class="field"><label>Season</label><input name="season" value="2029/30" required></div><div class="field"><label>Fee (€m)</label><input name="fee" type="number" min="0" value="0"></div><div class="field"><label>From club</label><input name="from" required></div><div class="field"><label>To club</label><input name="to" required></div></div><div class="actions"><button class="btn">Save transfer</button></div></form></div>`}
function saveTransfer(e){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));db.transfers.push({id:Date.now(),playerId:o.playerId,season:o.season,fee:num(o.fee),from:o.from,to:o.to});let p=byId(o.playerId);if(p){p.club=o.to;p.marketValue=p.marketValue||num(o.fee)}save();go('transfers');toast('Transfer saved')}
function newAward(playerId=''){let opts=db.players.map(p=>`<option value="${p.id}" ${p.id===playerId?'selected':''}>${esc(p.name)}</option>`).join('');document.getElementById('view').innerHTML=`<button class="btn secondary small" onclick="go('awards')">← Awards</button><div class="section"><h2>Add trophy or award</h2></div><div class="card"><form onsubmit="saveAward(event)"><div class="form"><div class="field full"><label>Player</label><select name="playerId">${opts}</select></div><div class="field"><label>Season</label><input name="season" value="2028/29" required></div><div class="field full"><label>Award / trophy</label><input name="name" required placeholder="Premier League Player of the Year"></div></div><div class="actions"><button class="btn">Save award</button></div></form></div>`}
function saveAward(e){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));db.awards.push({playerId:o.playerId,season:o.season,name:o.name});save();go('awards');toast('Award saved')}
function editInternational(id){let p=byId(id);document.getElementById('view').innerHTML=`<button class="btn secondary small" onclick="openPlayer('${id}')">← Player</button><div class="section"><h2>International stats</h2></div><div class="card"><form onsubmit="saveInternational(event,'${id}')"><div class="form"><div class="field"><label>National team caps</label><input name="caps" type="number" min="0" value="${num(p.caps)}"></div><div class="field"><label>Goals</label><input name="intGoals" type="number" min="0" value="${num(p.intGoals)}"></div><div class="field"><label>Assists</label><input name="intAssists" type="number" min="0" value="${num(p.intAssists)}"></div></div><div class="actions"><button class="btn">Save stats</button></div></form></div>`}
function saveInternational(e,id){e.preventDefault();let o=Object.fromEntries(new FormData(e.target)),p=byId(id);p.caps=num(o.caps);p.intGoals=num(o.intGoals);p.intAssists=num(o.intAssists);save();openPlayer(id);toast('International stats saved')}
function newCompetition(){let c=prompt('Competition name?');if(!c?.trim())return;if(!db.competitions.includes(c.trim()))db.competitions.push(c.trim());save();render();toast('Competition added')}
function saveMatch(e){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));db.matches.push({id:Date.now(),competition:o.competition,date:o.date,home:o.home.trim(),away:o.away.trim(),hg:num(o.hg),ag:num(o.ag)});save();go('match');toast('Match result saved')}
function deleteMatch(id){if(!confirm('Delete this match result?'))return;db.matches=db.matches.filter(m=>m.id!==id);save();render()}
function backupPage(){return `<div class="section" style="margin-top:2px"><h2>Backup & restore</h2></div><div class="card"><h3>Export your universe</h3><p class="note">Download a JSON backup containing players, stats, competitions, match results, awards and transfers. Keep it somewhere safe.</p><button class="btn" onclick="exportData()">Download backup</button></div><div class="card" style="margin-top:12px"><h3>Import a backup</h3><p class="note">Import a JSON backup previously exported from this app. This replaces the current data.</p><input id="importFile" type="file" accept=".json,application/json" class="search"><button class="btn secondary" onclick="importData()">Import backup</button></div><div class="card" style="margin-top:12px"><h3>Data warning</h3><p class="note">Data is stored in this browser on this device. It does not automatically sync across phones. Export backups before changing browsers or clearing app data.</p></div>`}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fictional-football-backup.json';a.click();URL.revokeObjectURL(a.href);toast('Backup downloaded')}
function importData(){let f=document.getElementById('importFile').files[0];if(!f){alert('Choose a backup JSON file first.');return}let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.players)||!Array.isArray(d.competitions))throw Error();if(!confirm('Replace all current app data with this backup?'))return;db=d;save();go('home');toast('Backup restored')}catch(e){alert('That file is not a valid Fictional Football backup.')}};r.readAsText(f)}
function resetDemo(){if(!confirm('This replaces your current data. Export a backup first if you want to keep it. Continue?'))return;db=initial();save();go('home');toast('Demo data restored')}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Could not save. Export a backup and free some browser storage.')}} 
function wire(){}
render();
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
</html>
